<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Space Grotesk, Arial, sans-serif">
  <title id="t">SPACe signal flow</title>
  <desc id="d">CDJs and samplers feed the DJ mixer, and the mixer feeds Spatial Launcher MK1 running SPACe over USB. SPACe outputs a multichannel spatialized signal to the PA through an audio interface and amplifiers, and a stereo zero-latency Booth output to the booth monitors, in sync with the PA.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/><stop offset="1" stop-color="#9b5de5"/>
    </linearGradient>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00c8ff"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9b5de5"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e0e0e0"/></marker>
    <g id="spk">
      <rect x="-14" y="-20" width="28" height="40" rx="4" fill="#12121c" stroke="#e0e0e0" stroke-width="1.5"/>
      <circle cy="-8" r="4" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
      <circle cy="7" r="8" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="1200" height="675" rx="16" fill="#04040a"/>

  <!-- Sources -->
  <text x="30" y="62" fill="#9b9bb0" font-size="14" letter-spacing="2">YOUR SETUP</text>
  <g fill="#12121c" stroke="#e0e0e0" stroke-width="1.5">
    <rect x="30" y="170" width="180" height="80" rx="10"/>
    <rect x="30" y="350" width="180" height="80" rx="10"/>
    <rect x="260" y="240" width="170" height="120" rx="10" stroke="#00c8ff"/>
  </g>
  <g fill="#fff" font-size="17" text-anchor="middle">
    <text x="120" y="206">CDJ / Sampler</text>
    <text x="120" y="386">CDJ / Sampler</text>
    <text x="345" y="294" font-weight="600">DJ Mixer</text>
  </g>
  <g fill="#9b9bb0" font-size="13" text-anchor="middle">
    <text x="120" y="228">digital or analog</text>
    <text x="120" y="408">digital or analog</text>
    <text x="345" y="316">headphones here</text>
  </g>
  <path d="M210 210H235V280H258M210 390H235V320H258" fill="none" stroke="#e0e0e0" stroke-width="2" marker-end="url(#aW)"/>
  <path d="M430 300H478" fill="none" stroke="#e0e0e0" stroke-width="2" marker-end="url(#aW)"/>
  <text x="454" y="288" fill="#9b9bb0" font-size="13" text-anchor="middle">USB</text>

  <!-- Launcher -->
  <rect x="480" y="190" width="260" height="220" rx="16" fill="#0b0b16" stroke="url(#g)" stroke-width="3"/>
  <text x="610" y="236" fill="#9b9bb0" font-size="13" text-anchor="middle" letter-spacing="2">SPATIAL LAUNCHER MK1</text>
  <text x="610" y="288" fill="url(#g)" font-size="46" font-weight="700" text-anchor="middle">SPACe</text>
  <text x="610" y="326" fill="#fff" font-size="15" text-anchor="middle">Auto-detects your setup</text>
  <text x="610" y="350" fill="#fff" font-size="15" text-anchor="middle">Surround  ·  CLUB mode</text>
  <text x="610" y="388" fill="#9b9bb0" font-size="13" text-anchor="middle">Spatial DJ · DMX · Network</text>

  <!-- PA branch -->
  <path d="M740 250H780V120H818" fill="none" stroke="#00c8ff" stroke-width="3" marker-end="url(#aB)"/>
  <text x="756" y="190" fill="#00c8ff" font-size="14" font-weight="600">PA</text>
  <rect x="820" y="85" width="160" height="70" rx="10" fill="#12121c" stroke="#00c8ff" stroke-width="1.5"/>
  <text x="900" y="115" fill="#fff" font-size="15" text-anchor="middle">Audio interface</text>
  <text x="900" y="135" fill="#fff" font-size="15" text-anchor="middle">&amp; amplifiers</text>
  <path d="M980 120H1012" stroke="#00c8ff" stroke-width="3" marker-end="url(#aB)"/>
  <use href="#spk" x="1050" y="75"/><use href="#spk" x="1105" y="75"/><use href="#spk" x="1160" y="75"/>
  <use href="#spk" x="1050" y="130"/><use href="#spk" x="1105" y="130"/><use href="#spk" x="1160" y="130"/>
  <text x="820" y="190" fill="#fff" font-size="18" font-weight="600">Multichannel spatialized</text>
  <text x="820" y="212" fill="#9b9bb0" font-size="14">Your whole PA becomes part of the show</text>

  <!-- Booth branch -->
  <path d="M740 350H780V520H818" fill="none" stroke="#9b5de5" stroke-width="3" marker-end="url(#aP)"/>
  <text x="792" y="450" fill="#9b5de5" font-size="14" font-weight="600">BOOTH</text>
  <rect x="820" y="485" width="160" height="70" rx="10" fill="#12121c" stroke="#9b5de5" stroke-width="1.5"/>
  <text x="900" y="526" fill="#fff" font-size="15" text-anchor="middle">Booth monitors</text>
  <path d="M980 520H1012" stroke="#9b5de5" stroke-width="3" marker-end="url(#aP)"/>
  <use href="#spk" x="1060" y="520"/><use href="#spk" x="1130" y="520"/>
  <text x="820" y="595" fill="#fff" font-size="18" font-weight="600">Stereo Booth · zero-latency render</text>
  <text x="820" y="617" fill="#9b9bb0" font-size="14">Perfect sync with the PA and with your headphones</text>

  <!-- Sync -->
  <line x1="900" y1="230" x2="900" y2="470" stroke="#7f7fd5" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="820" y="333" width="160" height="34" rx="17" fill="#04040a" stroke="url(#g)" stroke-width="2"/>
  <text x="900" y="355" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">0-latency sync</text>

  <!-- Legend -->
  <g font-size="13" fill="#9b9bb0">
    <line x1="40" y1="600" x2="70" y2="600" stroke="#e0e0e0" stroke-width="2"/><text x="80" y="605">Input</text>
    <line x1="140" y1="600" x2="170" y2="600" stroke="#00c8ff" stroke-width="3"/><text x="180" y="605">Dance floor</text>
    <line x1="280" y1="600" x2="310" y2="600" stroke="#9b5de5" stroke-width="3"/><text x="320" y="605">DJ booth</text>
  </g>
</svg>
