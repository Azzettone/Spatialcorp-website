<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 654" role="img" aria-labelledby="t d" font-family="Space Grotesk, Arial, sans-serif">
  <title id="t">SPACe signal flow</title>
  <desc id="d">CDJs and samplers feed the DJ mixer, and the mixer feeds Spatial Launcher MK1 running SPACe over USB. SPACe outputs a multichannel spatialized signal to the PA through an audio interface and amplifiers, and a stereo zero-latency Booth output to the booth monitors, in zero-latency sync with the headphones plugged into the mixer.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/><stop offset="1" stop-color="#9b5de5"/>
    </linearGradient>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00c8ff"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9b5de5"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffb020"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3ddc97"/></marker>
    <marker id="aS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b48cff"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e0e0e0"/></marker>
    <g id="spk">
      <rect x="-14" y="-20" width="28" height="40" rx="4" fill="#12121c" stroke="#e0e0e0" stroke-width="1.5"/>
      <circle cy="-8" r="4" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
      <circle cy="7" r="8" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="1200" height="654" rx="16" fill="#04040a"/>

  <!-- Sources -->
  <text x="40" y="38" fill="#9b9bb0" font-size="14" letter-spacing="2">YOUR SETUP</text>
  <g fill="#12121c" stroke="#e0e0e0" stroke-width="1.5">
    <rect x="50" y="52" width="150" height="80" rx="10"/>
    <rect x="50" y="388" width="150" height="80" rx="10"/>
    <rect x="20" y="200" width="210" height="120" rx="10" stroke="#ffb020"/>
  </g>
  <g fill="#fff" font-size="17" text-anchor="middle">
    <text x="125" y="88">CDJ / Sampler</text>
    <text x="125" y="424" font-size="16">CDJ / Turntable</text>
    <text x="125" y="254" font-weight="600">DJ Mixer</text>
  </g>
  <g fill="#9b9bb0" font-size="13" text-anchor="middle">
    <text x="125" y="110">digital or analog</text>
    <text x="125" y="446">digital or analog</text>
    <text x="125" y="276">headphones out</text>
  </g>
  <path d="M125 132V198" fill="none" stroke="#ffb020" stroke-width="2.5" marker-end="url(#aA)"/>
  <path d="M125 388V322" fill="none" stroke="#ffb020" stroke-width="2.5" marker-end="url(#aA)"/>
  <path d="M230 260H468" fill="none" stroke="#3ddc97" stroke-width="3" marker-end="url(#aG)"/>
  <text x="349" y="248" fill="#3ddc97" font-size="13" font-weight="600" text-anchor="middle">USB</text>

  <!-- Launcher (centered on x=600) -->
  <rect x="470" y="150" width="260" height="220" rx="16" fill="#0b0b16" stroke="url(#g)" stroke-width="3"/>
  <text x="600" y="196" fill="#9b9bb0" font-size="13" text-anchor="middle" letter-spacing="2">SPATIAL LAUNCHER MK1</text>
  <text x="600" y="248" fill="url(#g)" font-size="46" font-weight="700" text-anchor="middle">SPACe</text>
  <text x="600" y="286" fill="#fff" font-size="15" text-anchor="middle">Auto-detects your setup</text>
  <text x="600" y="310" fill="#fff" font-size="15" text-anchor="middle">Surround  ·  CLUB mode</text>
  <text x="600" y="348" fill="#9b9bb0" font-size="13" text-anchor="middle">Spatial DJ · DMX · Network</text>

  <!-- PA branch -->
  <path d="M730 200H775V100H818" fill="none" stroke="#00c8ff" stroke-width="3" marker-end="url(#aB)"/>
  <text x="747" y="170" fill="#00c8ff" font-size="14" font-weight="600">PA</text>
  <rect x="820" y="65" width="160" height="70" rx="10" fill="#12121c" stroke="#00c8ff" stroke-width="1.5"/>
  <text x="900" y="95" fill="#fff" font-size="15" text-anchor="middle">Audio interface</text>
  <text x="900" y="115" fill="#fff" font-size="15" text-anchor="middle">&amp; amplifiers</text>
  <path d="M980 100H1012" stroke="#00c8ff" stroke-width="3" marker-end="url(#aB)"/>
  <use href="#spk" x="1050" y="55"/><use href="#spk" x="1105" y="55"/><use href="#spk" x="1160" y="55"/>
  <use href="#spk" x="1050" y="110"/><use href="#spk" x="1105" y="110"/><use href="#spk" x="1160" y="110"/>
  <text x="820" y="170" fill="#fff" font-size="18" font-weight="600">Multichannel spatialized</text>
  <text x="820" y="192" fill="#9b9bb0" font-size="14">Your whole PA becomes part of the show</text>

  <!-- Booth branch -->
  <path d="M730 320H775V440H818" fill="none" stroke="#9b5de5" stroke-width="3" marker-end="url(#aP)"/>
  <text x="787" y="390" fill="#9b5de5" font-size="14" font-weight="600">BOOTH</text>
  <rect x="820" y="405" width="160" height="70" rx="10" fill="#12121c" stroke="#9b5de5" stroke-width="1.5"/>
  <text x="900" y="446" fill="#fff" font-size="15" text-anchor="middle">Booth monitors</text>
  <path d="M980 440H1012" stroke="#9b5de5" stroke-width="3" marker-end="url(#aP)"/>
  <use href="#spk" x="1060" y="440"/><use href="#spk" x="1130" y="440"/>
  <text x="820" y="532" fill="#fff" font-size="18" font-weight="600">Stereo Booth · zero-latency render</text>
  <text x="820" y="554" fill="#9b9bb0" font-size="14">Locked in sync with your headphones</text>

  <!-- Sync: mixer headphones <-> booth -->
  <path d="M215 322V496H900V477" fill="none" stroke="#b48cff" stroke-width="2.5" stroke-dasharray="7 6" marker-start="url(#aS)" marker-end="url(#aP)"/>
  <rect x="477" y="477" width="160" height="38" rx="19" fill="#04040a" stroke="#b48cff" stroke-width="2"/>
  <text x="557" y="501" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">0-latency sync</text>

  <!-- Legend -->
  <g font-size="13" fill="#9b9bb0">
    <line x1="30" y1="612" x2="60" y2="612" stroke="#ffb020" stroke-width="3"/><text x="70" y="617">CDJ to mixer</text>
    <line x1="175" y1="612" x2="205" y2="612" stroke="#3ddc97" stroke-width="3"/><text x="215" y="617">Mixer to SPACe</text>
    <line x1="350" y1="612" x2="380" y2="612" stroke="#00c8ff" stroke-width="3"/><text x="390" y="617">Dance floor</text>
    <line x1="490" y1="612" x2="520" y2="612" stroke="#9b5de5" stroke-width="3"/><text x="530" y="617">DJ booth</text>
    <line x1="620" y1="612" x2="650" y2="612" stroke="#b48cff" stroke-width="3" stroke-dasharray="6 4"/><text x="660" y="617">Headphones sync</text>
  </g>
</svg>
